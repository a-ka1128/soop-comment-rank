name: Watch live streamers

on:
  schedule:
    # 5분마다. GitHub 스케줄은 몇 분 밀리기도 한다.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/watch-live.mjs out/live.json

      # live-data 브랜치는 이 파일 하나만 담는다. 기록이 쌓일 이유가 없어 매번 새로 만들어 덮어쓴다.
      - name: Publish live.json to live-data
        run: |
          cd out
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -q -m "live $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live-data
