name: SOOP API health check

on:
  schedule:
    # 매일 06:20 KST (21:20 UTC). 정각은 러너가 몰려 밀리므로 피한다.
    - cron: '20 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: check
        run: |
          # 러너의 bash는 -e로 돌아서, 그냥 두면 실패한 순간 스텝이 끊기고
          # 리포트를 출력으로 넘기지 못한다. 종료 코드는 마지막에 직접 돌려준다.
          set +e
          node scripts/check-api.mjs > result.txt 2>&1
          status=$?
          set -e
          {
            echo 'report<<REPORT_EOF'
            cat result.txt
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          cat result.txt
          exit $status

      # 이미 열려 있는 이슈가 있으면 새로 만들지 않고 댓글만 단다.
      # 매일 실패할 때마다 이슈가 쌓이면 알림이 무의미해진다.
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'SOOP API 헬스체크 실패'
            const report = process.env.REPORT || '(출력 없음)'
            const body = [
              '`scripts/check-api.mjs`가 실패했습니다. 사이트가 틀린 결과를 보여주고 있을 수 있습니다.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `[실행 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n')

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'api-health',
            })

            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: open[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['api-health'],
              })
            }
        env:
          REPORT: ${{ steps.check.outputs.report }}
