name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 실행은 취소하지 않고 마지막 것만 반영한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      # 기록 서버 주소. 비밀값이 아니라 공개 URL이고, 접근은 database.rules.json 이 막는다.
      # 저장소 Variables 에 RTDB_URL 을 넣지 않으면 개인 추이 기능만 조용히 꺼진 채 빌드된다.
      - run: npm run build
        env:
          VITE_RTDB_URL: ${{ vars.RTDB_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
